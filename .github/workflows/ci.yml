name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build (TypeScript)
        run: npm run build

      - name: Run pipeline simulations (smoke test)
        run: npm run seed

      - name: Start server and smoke-test API
        run: |
          node dist/index.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:3001/agent-versions > /dev/null
          curl -sf http://localhost:3001/pipelines > /dev/null
          curl -sf http://localhost:3001/benchmarks > /dev/null
          kill $SERVER_PID

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentci:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
